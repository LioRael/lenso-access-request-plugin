[package]
name = "lenso-access-request-postgres-plugin"
version = "0.1.1"
description = "PostgreSQL-backed organization Access Request workflow Plugin for Lenso applications."
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.lenso]
plugin-id = "lenso.access-request.postgres"
root-slot = "access-requests"

[features]
default = []
postgres-acceptance = []

[dependencies]
lenso.workspace = true
lenso-auth-sdk.workspace = true
lenso-capability-access-control.workspace = true
lenso-capability-access-control-admin.workspace = true
lenso-capability-access-request-requester = { version = "0.1.1", path = "../lenso-capability-access-request-requester" }
lenso-capability-access-request-admin = { version = "0.1.1", path = "../lenso-capability-access-request-admin" }
lenso-capability-access-request-worker = { version = "0.1.1", path = "../lenso-capability-access-request-worker" }
lenso-capability-notification-transactional.workspace = true
lenso-capability-organization-directory.workspace = true
lenso-capability-organization-membership.workspace = true
lenso-capability-secrets.workspace = true
lenso-kernel.workspace = true
lenso-native-adapter.workspace = true
lenso-postgres-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
lenso-app-plan.workspace = true
tokio.workspace = true

[lints]
workspace = true
